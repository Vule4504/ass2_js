<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Cảm ơn – Susan Shop</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">


  <style>
    :root{ --primary:#ef4444; --dark:#0f172a; --muted:#64748b; --ring:#e5e7eb; }
    body{background:#f8fafc; color:#0f172a}
    .navbar{box-shadow:0 8px 24px rgba(0,0,0,.06)}
    .navbar .badge-cart{position:absolute; top:-6px; right:-10px}
    .footer{background:#0b1220; color:#cbd5e1; padding:40px 0; margin-top:40px}
    .footer h6{color:#fff; font-weight:700}
    .footer a{color:#cbd5e1; text-decoration:none}
    .footer a:hover{color:#fff; text-decoration:underline}
    .admin-chip{font-size:12px; padding:2px 8px; background:#e2e8f0; border-radius:999px; color:#0f172a}
    .required::after{content:" *"; color:#ef4444}
    .qty-control{display:flex; align-items:center; gap:8px}
    .qty-btn{width:28px; height:28px; display:inline-flex; align-items:center; justify-content:center; border:1px solid var(--ring); background:#fff; border-radius:6px; cursor:pointer}
    .qty-input{width:48px; text-align:center; border:1px solid var(--ring); border-radius:6px; height:28px; line-height:28px}
    .card-table th, .card-table td{vertical-align: middle;}
  </style>

</head>
<body>
  <div id="site-header"></div>

  <section class='container my-5 text-center'><div class='display-6 mb-3'>🎉 Cảm ơn bạn!</div><p>Đơn hàng của bạn đã được ghi nhận. Chúng tôi sẽ liên hệ để xác nhận và giao hàng sớm nhất.</p><a class='btn btn-dark mt-3' href='index.html'><i class='bi bi-house-door me-1'></i>Về trang chủ</a></section>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script src="assets/app.js"></script>
  <script>
    SUSAN.renderHeader('');
    SUSAN.renderFooter();
  </script>

</body>
</html>
