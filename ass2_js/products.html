<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sản phẩm – Susan Shop</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />

    <style>
      :root {
        --primary: #ef4444;
        --dark: #0f172a;
        --muted: #64748b;
        --ring: #e5e7eb;
      }
      body {
        background: #f8fafc;
        color: #0f172a;
      }
      .navbar {
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
      }
      .navbar .badge-cart {
        position: absolute;
        top: -6px;
        right: -10px;
      }
      .footer {
        background: #0b1220;
        color: #cbd5e1;
        padding: 40px 0;
        margin-top: 40px;
      }
      .footer h6 {
        color: #fff;
        font-weight: 700;
      }
      .footer a {
        color: #cbd5e1;
        text-decoration: none;
      }
      .footer a:hover {
        color: #fff;
        text-decoration: underline;
      }
      .admin-chip {
        font-size: 12px;
        padding: 2px 8px;
        background: #e2e8f0;
        border-radius: 999px;
        color: #0f172a;
      }
      .required::after {
        content: " *";
        color: #ef4444;
      }
      .qty-control {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .qty-btn {
        width: 28px;
        height: 28px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--ring);
        background: #fff;
        border-radius: 6px;
        cursor: pointer;
      }
      .qty-input {
        width: 48px;
        text-align: center;
        border: 1px solid var(--ring);
        border-radius: 6px;
        height: 28px;
        line-height: 28px;
      }
      .card-table th,
      .card-table td {
        vertical-align: middle;
      }
    </style>
  </head>
  <body>
    <div id="site-header"></div>

    <section class="container my-4">
      <div class="d-flex align-items-end gap-3 flex-wrap">
        <div>
          <label class="form-label">Danh mục</label>
          <select
            id="filterCat"
            class="form-select"
            style="min-width: 220px"
          ></select>
        </div>
        <div>
          <label class="form-label">Giá từ (VND)</label>
          <input
            id="minPrice"
            type="number"
            class="form-control"
            placeholder="0"
          />
        </div>
        <div>
          <label class="form-label">đến (VND)</label>
          <input
            id="maxPrice"
            type="number"
            class="form-control"
            placeholder="50000000"
          />
        </div>
        <div class="ms-auto d-flex gap-2">
          <button id="btnApply" class="btn btn-dark">Lọc</button>
          <button id="btnReset" class="btn btn-outline-secondary">
            Xóa lọc
          </button>
        </div>
      </div>
      <hr />
      <div id="productGrid" class="row g-3"></div>
    </section>
    <script>
      function getParam(name) {
        return new URLSearchParams(location.search).get(name);
      }
      let allProducts = [];
      let allCats = [];

      function renderProducts(list) {
        const grid = document.getElementById("productGrid");
        grid.innerHTML = list
          .map(
            (p) => `
    <div class="col-12 col-sm-6 col-lg-4">
      <div class="card h-100">
        <img src="${
          p.image
        }" class="card-img-top" style="height:190px;object-fit:cover">
        <div class="card-body d-flex flex-column">
          <h6 class="card-title">${p.name}</h6>
          <div class="mb-2 text-danger fw-bold">${SUSAN.fmtVND(p.price)}</div>
          <p class="text-muted small">Danh mục: ${
            (allCats.find((c) => String(c.id) === String(p.categoryId)) || {})
              .name || "-"
          }</p>
          <div class="mt-auto d-flex gap-2">
            <a class="btn btn-outline-secondary" href="product.html?id=${
              p.id
            }">Chi tiết</a>
            <button class="btn btn-dark" onclick='SUSAN.cartAdd(${JSON.stringify(
              p.id
            )},1)'>Thêm giỏ</button>
          </div>
        </div>
      </div>
    </div>
  `
          )
          .join("");
      }

      async function loadFilters() {
        allCats = await SUSAN.get("/categories");
        const sel = document.getElementById("filterCat");
        sel.innerHTML =
          '<option value="">Tất cả</option>' +
          allCats
            .map((c) => `<option value="${c.id}">${c.name}</option>`)
            .join("");
        const catParam = getParam("cat");
        if (catParam) {
          sel.value = catParam;
        }
      }

      function applyFilter() {
        const cat = document.getElementById("filterCat").value;
        const min = parseInt(
          document.getElementById("minPrice").value || "0",
          10
        );
        const max = parseInt(
          document.getElementById("maxPrice").value || "999999999",
          10
        );
        let list = [...allProducts];
        if (cat)
          list = list.filter((p) => String(p.categoryId) === String(cat));
        list = list.filter((p) => p.price >= min && p.price <= max);
        renderProducts(list);
      }

      document.addEventListener("DOMContentLoaded", async () => {
        await loadFilters();
        allProducts = await SUSAN.get("/products");
        renderProducts(allProducts);
        document
          .getElementById("btnApply")
          .addEventListener("click", applyFilter);
        document.getElementById("btnReset").addEventListener("click", () => {
          document.getElementById("filterCat").value = "";
          document.getElementById("minPrice").value = "";
          document.getElementById("maxPrice").value = "";
          renderProducts(allProducts);
        });
      });
    </script>

    <div id="site-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="assets/app.js"></script>
    <script>
      SUSAN.renderHeader("products");
      SUSAN.renderFooter();
    </script>
  </body>
</html>
