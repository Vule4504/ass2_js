<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chi tiết sản phẩm – Susan Shop</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />

    <style>
      :root {
        --primary: #ef4444;
        --dark: #0f172a;
        --muted: #64748b;
        --ring: #e5e7eb;
      }
      body {
        background: #f8fafc;
        color: #0f172a;
      }
      .navbar {
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
      }
      .navbar .badge-cart {
        position: absolute;
        top: -6px;
        right: -10px;
      }
      .footer {
        background: #0b1220;
        color: #cbd5e1;
        padding: 40px 0;
        margin-top: 40px;
      }
      .footer h6 {
        color: #fff;
        font-weight: 700;
      }
      .footer a {
        color: #cbd5e1;
        text-decoration: none;
      }
      .footer a:hover {
        color: #fff;
        text-decoration: underline;
      }
      .admin-chip {
        font-size: 12px;
        padding: 2px 8px;
        background: #e2e8f0;
        border-radius: 999px;
        color: #0f172a;
      }
      .required::after {
        content: " *";
        color: #ef4444;
      }
      .qty-control {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .qty-btn {
        width: 28px;
        height: 28px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--ring);
        background: #fff;
        border-radius: 6px;
        cursor: pointer;
      }
      .qty-input {
        width: 48px;
        text-align: center;
        border: 1px solid var(--ring);
        border-radius: 6px;
        height: 28px;
        line-height: 28px;
      }
      .card-table th,
      .card-table td {
        vertical-align: middle;
      }
    </style>
  </head>
  <body>
    <div id="site-header"></div>

    <section class="container my-4" id="detail"></section>
    <script>
      function getParam(name) {
        return new URLSearchParams(location.search).get(name);
      }
      document.addEventListener("DOMContentLoaded", async () => {
        const id = getParam("id");
        const list = await SUSAN.get("/products?id=" + encodeURIComponent(id));
        const cats = await SUSAN.get("/categories");
        const p = list[0];
        const el = document.getElementById("detail");
        if (!p) {
          el.innerHTML =
            '<div class="alert alert-warning">Không tìm thấy sản phẩm.</div>';
          return;
        }
        const cat =
          (cats.find((c) => String(c.id) === String(p.categoryId)) || {})
            .name || "-";
        el.innerHTML = `
    <div class="row g-4">
      <div class="col-md-5"><img src="${
        p.image
      }" class="w-100 rounded" style="object-fit:cover"></div>
      <div class="col-md-7">
        <h3>${p.name}</h3>
        <div class="h4 text-danger">${SUSAN.fmtVND(p.price)}</div>
        <p><span class="badge bg-secondary">Danh mục: ${cat}</span></p>
        <p class="text-muted">${p.desc || ""}</p>
        <p class="text-muted">Tồn kho: ${p.stock || 0}</p>
        <div class="d-flex gap-2">
          <button class="btn btn-dark" onclick='SUSAN.cartAdd(${JSON.stringify(
            p.id
          )},1)'><i class="bi bi-cart-plus me-1"></i>Thêm vào giỏ</button>
          <a class="btn btn-outline-secondary" href="products.html">Quay lại</a>
        </div>
        
        <!-- Specs -->
        <hr />
        <h5>Thông số kỹ thuật</h5>
        ${
          p.specs && Object.keys(p.specs).length
            ? `
          <table class="table table-sm">
            <tbody>
              ${Object.keys(p.specs)
                .map(
                  (k) =>
                    `<tr><th style="width:40%">${k}</th><td>${p.specs[k]}</td></tr>`
                )
                .join("")}
            </tbody>
          </table>
        `
            : `<p class="text-muted small">Chưa có thông số chi tiết cho sản phẩm này.</p>`
        }
      </div>
    </div>
  `;
      });
    </script>

    <div id="site-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="assets/app.js"></script>
    <script>
      SUSAN.renderHeader("products");
      SUSAN.renderFooter();
    </script>
  </body>
</html>
